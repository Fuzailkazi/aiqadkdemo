# Render Blueprint: the agent and the weather MCP as two separate services,
# both free web services on Render's native Node runtime (no Docker).
# Render dashboard → New → Blueprint → pick this repo.

services:
  # The weather MCP (source in mcp/weather-mcp/). Free web services are public,
  # so serve.mjs requires a bearer token (MCP_AUTH_TOKEN, generated by Render)
  # on every call — without it anyone could call the tools directly and skip
  # the agent and ArmorIQ. Only /healthz is open.
  - type: web
    name: weather-mcp
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      cd mcp/weather-mcp &&
      npm ci --include=dev &&
      npm run build &&
      npm install --no-save supergateway@4.0.0
    startCommand: cd mcp/weather-mcp && node serve.mjs
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - mcp/weather-mcp/**
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # "standard" turns on the saved-location tools (save/list/get/remove).
      - key: ENABLED_TOOLS
        value: standard
      - key: MCP_AUTH_TOKEN
        generateValue: true

  # The agent: ADK dev UI + ArmorIQ. Public URL.
  # Free plan sleeps after ~15 min idle (first request then takes ~1 min).
  - type: web
    name: weather-agent
    runtime: node
    plan: free
    region: singapore
    # Dev dependencies on purpose: the `adk` CLI lives in @google/adk-devtools.
    buildCommand: npm ci --include=dev
    # The MCP's public URL is https://<its slug>.onrender.com/mcp. If Render
    # gives it a different domain, set WEATHER_MCP_URL in the dashboard instead.
    startCommand: >-
      WEATHER_MCP_URL="${WEATHER_MCP_URL:-https://$WEATHER_MCP_SLUG.onrender.com/mcp}"
      npx adk web agents --host 0.0.0.0 --port $PORT
    buildFilter:
      ignoredPaths:
        - mcp/**
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WEATHER_MCP_SLUG
        fromService:
          type: web
          name: weather-mcp
          property: slug
      # Same token the MCP generated; the agent sends it as a bearer header.
      - key: WEATHER_MCP_TOKEN
        fromService:
          type: web
          name: weather-mcp
          envVarKey: MCP_AUTH_TOKEN
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Secrets — Render asks for these when you create the Blueprint.
      - key: GOOGLE_API_KEY
        sync: false
      - key: ARMORIQ_API_KEY
        sync: false
      - key: USER_EMAIL
        sync: false
